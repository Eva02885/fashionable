<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
          font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-[#f9f9f9] p-4">
    <!-- Sign Up Form Section -->
    <section class="w-full max-w-md">
      <div class="rounded-none bg-white p-8 shadow-sm">
        <!-- Header -->
        <div class="mb-8 text-center">
          <div class="mb-4 flex justify-center">
            <svg class="h-12 w-12 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
          </div>
          <h1 class="mb-2 text-2xl font-bold text-black">Create Account</h1>
          <p class="text-sm text-gray-600">Join us today and get started with your account</p>
        </div>

        <!-- Form -->
        <form id="" class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="firstName" class="mb-2 block text-sm font-medium text-gray-700">First Name</label>
              <input type="text" id="firstName" name="firstName" class="w-full border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-transparent focus:ring-2 focus:ring-black focus:outline-none" placeholder="John" required />
            </div>
            <div>
              <label for="lastName" class="mb-2 block text-sm font-medium text-gray-700">Last Name</label>
              <input type="text" id="lastName" name="lastName" class="w-full border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-transparent focus:ring-2 focus:ring-black focus:outline-none" placeholder="Doe" required />
            </div>
          </div>

          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" id="email" name="email" class="w-full border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-transparent focus:ring-2 focus:ring-black focus:outline-none" placeholder="your.email@example.com" required />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" class="w-full border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-transparent focus:ring-2 focus:ring-black focus:outline-none" placeholder="Create a strong password" required />
            <p class="mt-2 text-xs text-gray-500">Must be at least 8 characters with numbers and symbols</p>
          </div>

          <div>
            <label for="confirmPassword" class="mb-2 block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="w-full border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-transparent focus:ring-2 focus:ring-black focus:outline-none" placeholder="Confirm your password" required />
          </div>

          <div class="flex items-start">
            <input type="checkbox" id="terms" name="terms" class="mt-1 h-4 w-4 rounded border-gray-300 text-black focus:ring-black" required />
            <label for="terms" class="ml-2 block text-sm text-gray-700"> I agree to the <a href="#" class="text-black underline hover:no-underline">Terms of Service</a> and <a href="#" class="text-black underline hover:no-underline">Privacy Policy</a> </label>
          </div>

          <div class="flex items-start">
            <input type="checkbox" id="newsletter" name="newsletter" class="mt-1 h-4 w-4 rounded border-gray-300 text-black focus:ring-black" />
            <label for="newsletter" class="ml-2 block text-sm text-gray-700"> Send me product updates and newsletters </label>
          </div>

          <button type="submit" class="w-full bg-black px-6 py-3 text-sm font-medium text-white transition-colors hover:bg-[#ff6b6b]">Create Account</button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="mx-4 flex-shrink text-sm text-gray-500">Or sign up with</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Social Sign Up -->
        <div class="mb-6 grid grid-cols-2 gap-4">
          <button type="button" class="flex items-center justify-center border border-gray-300 bg-white px-4 py-3 text-gray-700 transition-colors hover:bg-gray-50">
            <svg class="mr-2 h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Google
          </button>
          <button type="button" class="flex items-center justify-center border border-gray-300 bg-white px-4 py-3 text-gray-700 transition-colors hover:bg-gray-50">
            <svg class="mr-2 h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z" />
            </svg>
            Twitter
          </button>
        </div>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-sm text-gray-600">
            Already have an account?
            <a href="/login.html" class="font-medium text-[#ff6b6b] transition-colors hover:text-gray-700">Sign in</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
