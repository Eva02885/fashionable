  <title>Fashionable | Shopping Cart</title>

<body class="bg-gray-50">

  <div class="container mx-auto mt-10 px-4">
    <div class="sm:flex shadow-md my-10 bg-white">

      <!-- SHOPPING CART -->
      <div class="w-full sm:w-3/6 bg-white px-6 md:px-10 py-10">

        <!-- Cart Heading -->
        <div class="flex justify-between items-center border-b pb-8">
          <h1 class="font-semibold text-2xl">Shopping Cart</h1>

          <h2 id="cart-item-count" class="font-semibold text-xl">
            0 Items
          </h2>
        </div>

        <!-- Products will be displayed here by JavaScript -->
        <div id="cart-items">
          <p class="py-8 text-gray-500">Loading cart...</p>
        </div>

        <!-- Continue Shopping -->
        <a href="index.html"
          class="flex items-center font-semibold text-indigo-600 text-sm mt-10">

          <svg class="fill-current mr-2 text-indigo-600 w-4"
            viewBox="0 0 448 512"
            aria-hidden="true">
            <path d="M134.059 296H436c6.627 0 12-5.373 12-12v-56c0-6.627-5.373-12-12-12H134.059v-46.059c0-21.382-25.851-32.09-40.971-16.971L7.029 239.029c-9.373 9.373-9.373 24.569 0 33.941l86.059 86.059c15.119 15.119 40.971 4.411 40.971-16.971V296z"/>
          </svg>

          Continue Shopping
        </a>

      </div>

      <!-- ORDER SUMMARY -->
      <div id="summary"
        class="w-full sm:w-1/2 lg:w-1/4 px-6 md:px-8 py-10 bg-gray-50">

        <h1 class="font-semibold text-2xl border-b pb-8">
          Order Summary
        </h1>

        <!-- Item Count and Subtotal -->
        <div class="flex justify-between mt-10 mb-5 gap-4">
          <span class="font-semibold text-sm uppercase">
            Items (<span id="summary-item-count">0</span>)
          </span>

          <span id="subtotal" class="font-semibold text-sm">
            $0.00
          </span>
        </div>

        <!-- Shipping -->
        <div>
          <label for="shipping"
            class="font-medium inline-block mb-3 text-sm uppercase">
            Shipping
          </label>

          <select id="shipping"
            class="block p-2 border border-gray-200 text-gray-600 w-full text-sm">

            <option value="10">Standard shipping - $10.00</option>
            <option value="0">Free shipping - $0.00</option>

          </select>
        </div>

        <!-- Promo Code -->
        <div class="py-8">
          <label for="promo"
            class="font-semibold inline-block mb-3 text-sm uppercase">
            Promo Code
          </label>

          <input
            type="text"
            id="promo"
            placeholder="Enter your code"
            class="p-2 text-sm w-full border border-gray-200"
          >
        </div>

        <button
          id="apply-promo"
          type="button"
          class="bg-red-500 hover:bg-red-600 px-5 py-2 text-sm text-white uppercase">

          Apply
        </button>

        <p id="promo-message" class="text-sm mt-2"></p>

        <!-- Total and Checkout -->
        <div class="border-t mt-8">

          <div class="flex font-semibold justify-between py-6 text-sm uppercase gap-4">
            <span>Total Cost</span>

            <span id="total-cost">$0.00</span>
          </div>

          <button
            id="checkout"
            type="button"
            class="bg-indigo-500 font-semibold hover:bg-indigo-600 py-3 text-sm text-white uppercase w-full">

            Checkout
          </button>

        </div>

      </div>

    </div>
  </div>
